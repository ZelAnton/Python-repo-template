name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep the source checkout intact for initializer tests and validate tooling
      # against the actual generated repository in a disposable copy.
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Config is .yamllint.yml — tuned for Actions YAML. Real defects (tabs,
      # duplicate keys, bad indentation) fail; cosmetic line-length stays a
      # non-failing warning.
      - name: Lint YAML
        shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked yamllint .

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"
      # setup-uv installs uv and provisions the Python pinned by .python-version /
      # requires-python on demand; enable-cache reuses the resolver/download cache.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Formatting must be clean (CI gate) and the lint set must pass.
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked ruff format --check .
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # mypy --strict is this template's warnings-as-errors gate for types.
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked mypy

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # The template-only suites run against the untouched checkout because they
      # invoke both initializer scripts. The full suite then proves the generated
      # repository still tests cleanly after those scripts are removed.
      - shell: bash
        run: |
          uv run --no-project --with pytest pytest \
            tests/test_initializers.py tests/test_init_cli.py tests/test_init_scripts.py \
            tests/test_ci_configuration.py
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked pytest

  build:
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Prove the package builds cleanly — the same step the release runs.
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" build

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare generated repository
        shell: bash
        run: |
          generated_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$generated_dir"
          bash "$generated_dir/scripts/init.sh" --project-name template-self-test
          echo "GENERATED_REPOSITORY=$generated_dir" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Scan the resolved dependency tree against the PyPI Advisory Database
      # (the Python ecosystem's supply-chain audit). `--with` adds pip-audit to
      # the synced project environment so it sees the project's real deps;
      # `--skip-editable` skips this not-yet-published project itself.
      - shell: bash
        run: uv --directory "$GENERATED_REPOSITORY" run --locked --with pip-audit pip-audit --skip-editable
