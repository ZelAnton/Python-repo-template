name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      # Config is .yamllint.yml — tuned for Actions YAML. Real defects (tabs,
      # duplicate keys, bad indentation) fail; cosmetic line-length stays a
      # non-failing warning.
      - name: Lint YAML
        run: yamllint .

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Template self-test: in the template repo itself the project-name
      # placeholder token is not a valid Python distribution name (PEP 508 names
      # cannot start or end with an underscore), so uv cannot even parse
      # pyproject.toml. Stamp the throwaway runner checkout with a dummy name
      # first — this doubles as an end-to-end test of the init script. The
      # condition deliberately avoids the literal token (init would substitute it
      # here too): TEMPLATE.md and the init script coexist only in the template
      # repo (init deletes both), so in a generated repo this step is a no-op.
      - name: Initialize template placeholders (no-op in generated repos)
        shell: bash
        run: |
          if [ -f TEMPLATE.md ] && [ -f scripts/init.sh ]; then
            bash ./scripts/init.sh --project-name template-self-test
          fi
      # setup-uv installs uv and provisions the Python pinned by .python-version /
      # requires-python on demand; enable-cache reuses the resolver/download cache.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # Formatting must be clean (CI gate) and the lint set must pass.
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Template self-test — see the `lint` job's comment.
      - name: Initialize template placeholders (no-op in generated repos)
        shell: bash
        run: |
          if [ -f TEMPLATE.md ] && [ -f scripts/init.sh ]; then
            bash ./scripts/init.sh --project-name template-self-test
          fi
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # mypy --strict is this template's warnings-as-errors gate for types.
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Template self-test — see the `lint` job's comment. `shell: bash` exists on
      # all three runner OSes (Git Bash on Windows).
      - name: Initialize template placeholders (no-op in generated repos)
        shell: bash
        run: |
          if [ -f TEMPLATE.md ] && [ -f scripts/init.sh ]; then
            bash ./scripts/init.sh --project-name template-self-test
          fi
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # `uv run` provisions the interpreter, syncs the env, then runs pytest.
      - run: uv run pytest

  build:
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Template self-test — see the `lint` job's comment.
      - name: Initialize template placeholders (no-op in generated repos)
        shell: bash
        run: |
          if [ -f TEMPLATE.md ] && [ -f scripts/init.sh ]; then
            bash ./scripts/init.sh --project-name template-self-test
          fi
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # Prove the package builds cleanly — the same step the release runs.
      - run: uv build

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Template self-test — see the `lint` job's comment.
      - name: Initialize template placeholders (no-op in generated repos)
        shell: bash
        run: |
          if [ -f TEMPLATE.md ] && [ -f scripts/init.sh ]; then
            bash ./scripts/init.sh --project-name template-self-test
          fi
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # Scan the resolved dependency tree against the PyPI Advisory Database
      # (the Python ecosystem's supply-chain audit). `--with` adds pip-audit to
      # the synced project environment so it sees the project's real deps;
      # `--skip-editable` skips this not-yet-published project itself.
      - run: uv run --with pip-audit pip-audit --skip-editable
